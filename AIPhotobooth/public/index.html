<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="AI Photobooth - Transform your photos with AI magic">
  
  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <title>AI Photobooth</title>
  
  <!-- Preconnect to fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0f0f0f;
      color: white;
      overflow-x: hidden;
    }
    
    /* Loading animation */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f0f0f;
      z-index: 9999;
    }
    
    .loading-logo {
      font-size: 32px;
      font-weight: bold;
      color: white;
      display: flex;
      align-items: center;
    }
    
    .loading-highlight {
      color: #a855f7;
      margin-left: 8px;
    }

    .logo-image {
      height: 50px;
      width: auto;
      margin-right: 15px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.8; transform: scale(1); }
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      margin-top: 20px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #a855f7;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  
  <div id="root">
    <div class="loading-container">
      <div style="text-align: center;">
        <div class="loading-logo">
          <img src="%PUBLIC_URL%/logo192.png" alt="AI Photobooth" class="logo-image">
          AI <span class="loading-highlight">Photobooth</span>
        </div>
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>
</body>
</html>
